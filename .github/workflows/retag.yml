name: Retag major/minor

# Mirrors the standard GitHub Action versioning convention: when we publish
# `vX.Y.Z`, also force-update the rolling `vX` and `vX.Y` tags so consumers
# can pin `tmcw/notfoundbot@v3` or `@v3.0`.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Update major/minor tags
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Tag '$TAG' is not a vX.Y.Z release; skipping retag."
            exit 0
          fi
          major=$(echo "$TAG" | cut -d. -f1)
          minor=$(echo "$TAG" | cut -d. -f1-2)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$TAG"
          git tag -f "$minor" "$TAG"
          git push -f origin "$major" "$minor"
